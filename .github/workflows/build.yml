name: Build Head HUD

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: head-hud-project/head-hud

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Build Head HUD
        run: gradle build

      - name: Upload Head HUD JAR
        uses: actions/upload-artifact@v4
        with:
          name: head-hud-jar
          path: head-hud-project/head-hud/build/libs/head-hud-1.0.0.jar
          
